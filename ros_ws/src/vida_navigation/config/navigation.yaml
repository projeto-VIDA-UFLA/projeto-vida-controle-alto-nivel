# Parametros da navegacao (notebook). Os valores vieram do simulador
# (closed_loop / simulation.launch.py) e devem ser revistos na pista.
stanley:
  ros__parameters:
    wheelbase_m: 1.125          # geometrico: posicao do eixo dianteiro
    # Efetivo para o feedforward: 1,42 medido em 30/10 com a roda traseira
    # patinando no eixo (falta a chaveta). Na 1a volta completa da rota_4
    # (31/10) o carro cortou as curvas por dentro dos dois lados (+29 cm nas da
    # esquerda, -14 cm nas da direita) e as curvas deram ~1,17 m. Remedir com a
    # chaveta definitiva.
    feedforward_wheelbase_m: 1.17
    # 2o ajuste (30/10): o 1o Stanley (k 2,2) oscilou +-10 graus a 0,7 Hz pelo
    # atraso de ~0,3 s do esterçamento e pelo carro virando ~16% mais na grama.
    # No simulador calibrado com esse teste, k 1,5 + amortecimento de giro 0,2 s
    # reduziu a oscilacao ~60% (amortecimento >= 0,4 volta a oscilar a 0,9 Hz).
    gain_k: 1.5                 # erro lateral: atan(k e / (k_s + v))
    yaw_damping_s: 0.2          # -k_r (r - v kappa): freia o giro em excesso
    softening_m_s: 1.0
    feedforward_gain: 1.0       # atan(L kappa)
    max_steering_deg: 20.0      # = STEERING_REFERENCE_MAX_DEG do firmware
    steering_rate_deg_s: 40.0
    speed_m_s: 2.0              # 31/10: 1,5 na 1a volta completa da rota_4. No
                                # simulador, 2,0 aumenta o erro lateral ~15% sem
                                # mudar ganhos (k ja e normalizado pela velocidade)
    brake_decel_m_s2: 1.5       # freio total no plano (30/10): para a v^2/2a + v*atraso do fim
    brake_delay_s: 0.2
    odom_timeout_s: 0.2

mode_manager:
  ros__parameters:
    wheelbase_m: 1.125
    start_max_distance_m: 3.0       # antena ate o inicio do caminho para aceitar o pedido
    max_enable_cross_track_m: 0.5   # depois da manobra (2,5 m/s: pior caso 0,64 m)
    max_heading_error_deg: 15.0
    max_cross_track_m: 1.5          # aborto durante o automatico
    maneuver_speed_m_s: 1.5         # mesma velocidade do Stanley no 1o teste
    maneuver_max_distance_m: 15.0
    maneuver_timeout_s: 20.0
    preparing_timeout_s: 5.0
    calibrating_timeout_s: 15.0
    stopping_timeout_s: 15.0
    steering_aligned_deg: 1.5
    max_correction_age_s: 5.0
    gnss_timeout_s: 2.5
    esp_block_tolerance_s: 0.3      # bloqueio do ESP32 mais curto que isso nao aborta
