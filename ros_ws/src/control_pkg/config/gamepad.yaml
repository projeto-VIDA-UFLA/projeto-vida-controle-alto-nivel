# Nome do nó que converte os comandos do gamepad em referências para o veículo.
/gamepad/control:
  # Seção padrão do ROS 2 que reúne os parâmetros do nó.
  ros__parameters:
    # Índice do eixo horizontal do analógico esquerdo na mensagem Joy (comum em controles PS4 no Linux).
    left_stick_axis: 0
    # Índice do eixo do gatilho R2 na mensagem Joy (comum em controles PS4 no Linux).
    r2_axis: 5
    # Índice do eixo do gatilho L2 na mensagem Joy, usado como freio (comum em controles PS4 no Linux).
    l2_axis: 2
    # Velocidade de referencia (m/s) com o R2 no fundo. O ESP32 limita a
    # DRIVE_MAX_TARGET_SPEED_M_S (2,5 m/s nos ensaios no chao, 30/10).
    max_speed_m_s: 2.5
    # Angulo de esterçamento (graus) com o analogico no fim. Era fixo em 15 ate
    # 31/10; 20 = STEERING_REFERENCE_MAX_DEG do firmware e o limite do Stanley.
    max_steering_deg: 20.0
    # Fracao do curso do L2 a partir da qual a velocidade e zerada e o freio vai a total.
    brake_threshold: 0.1
    # Modo bancada (veiculo suspenso): segurar o botao de entrada (X) ou de saida (O)
    # por bench_hold_time_s. O ESP32 so entra com o veiculo parado e confirma com
    # vibracao continua (entrou) ou pulsada (saiu). Indices do PS4 no Linux.
    bench_enter_button: 0
    bench_exit_button: 1
    bench_hold_time_s: 5.0
    # Modo automatico (vida_navigation): segurar triangulo (entrar) ou quadrado
    # (sair) por auto_hold_time_s. Vibracao: 1 pulso = pedido aceito, 2 pulsos
    # longos = Stanley no comando, 4 pulsos curtos = de volta ao manual,
    # continua = aborto (freio total), 6 pulsos rapidos = pedido recusado.
    auto_enter_button: 2
    auto_exit_button: 3
    auto_hold_time_s: 5.0
    # Modo manobra (freio solto para empurrar o veiculo, inclusive com o enable
    # fisico desligado): segurar R1 por maneuver_hold_time_s liga/desliga; R2 ou
    # L2 cancelam. O ESP32 so entra parado e cancela se o veiculo passar de
    # 2,5 m/s ou o enable fisico for desligado. Vibracao: 2 pulsos curtos = freio
    # solto; 1 pulso longo = freio de volta.
    maneuver_button: 5
    maneuver_hold_time_s: 3.0
    # Sem mensagens do joy_node por mais que isso: referencias zeradas e freio total
    # (o joy_node republica a autorepeat_rate, 50 Hz).
    joy_timeout_s: 0.25
    # Topicos das referencias. Sozinho, o gamepad comanda o ESP32 direto; o launch da
    # navegacao troca para /gamepad/* e o mode_manager repassa no modo manual.
    steering_reference_topic: "/vida/control/steering/reference"
    drive_reference_topic: "/vida/control/drive/reference"

# Nome do nó do pacote joy responsável por ler o gamepad conectado ao sistema.
/gamepad/joy_node:
  # Seção padrão do ROS 2 que reúne os parâmetros do nó.
  ros__parameters:
    # Identificador do dispositivo de entrada; 0 corresponde normalmente a /dev/input/js0.
    device_id: 0
    # Frequência, em hertz, com que o último estado do gamepad é republicado sem novos eventos.
    autorepeat_rate: 50.0
