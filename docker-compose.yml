services:

  ros_ws:
    build:
      context: ./ros_ws
      dockerfile: Dockerfile
    image: vida-ros-ws:humble
    container_name: ros_ws
    restart: unless-stopped
    network_mode: host
    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && source /vida_ws/install/setup.bash && sleep infinity"]